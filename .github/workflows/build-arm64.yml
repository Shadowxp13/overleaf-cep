# Name shown in the GitHub Actions tab
name: build-arm64

# Runs only when triggered manually
on:
  workflow_dispatch:
    inputs:
      tag:
        # Tag applied to both images. If left empty, "latest" is used
        description: Image tag (leave empty for latest)
        required: false

# The workflow only needs read access to the repository contents
permissions:
  contents: read

jobs:
  build:
    # Native arm64 runner, so no emulation is needed
    runs-on: ubuntu-24.04-arm
    steps:
      # Downloads the repository code
      - uses: actions/checkout@v4

      # Sets up Docker Buildx, the builder used by build-push-action
      - uses: docker/setup-buildx-action@v3

      # Authenticates on Docker Hub with the repository secrets
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Builds and pushes the base image
      - name: Build base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile-base
          platforms: linux/arm64
          push: true
          # Uses the input tag, or "latest" when the input is empty
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sharelatex-base:${{ inputs.tag || 'latest' }}
          # Reuses the GitHub Actions cache to speed up builds
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      # Builds and pushes the community image on top of the base image
      - name: Build community
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile
          platforms: linux/arm64
          push: true
          # Points the Dockerfile to the base image built in the previous step
          build-args: |
            OVERLEAF_BASE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/sharelatex-base:${{ inputs.tag || 'latest' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sharelatex:${{ inputs.tag || 'latest' }}
          cache-from: type=gha,scope=cep
          cache-to: type=gha,mode=max,scope=cep
